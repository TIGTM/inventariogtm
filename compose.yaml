services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestao_ti
      POSTGRES_USER: gestao
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD no .env}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestao -d gestao_ti"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "migrate.py"]
    environment:
      DATABASE_URL: postgresql://gestao:${DB_ADMIN_PASSWORD:?Defina DB_ADMIN_PASSWORD no .env}@db:5432/gestao_ti
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no .env}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://patrimonio_app:${APP_DB_PASSWORD:?Defina APP_DB_PASSWORD no .env}@db:5432/gestao_ti
      TI_PASSWORD_HASH: ${TI_PASSWORD_HASH:?Gere o hash TI com change_password.py}
      MARKETING_PASSWORD_HASH: ${MARKETING_PASSWORD_HASH:?Gere o hash MARKETING com change_password.py}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Defina PUBLIC_ORIGIN com o dominio HTTPS}
      COOKIE_SECURE: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on: [api]
    networks: [backend]

networks:
  backend:

volumes:
  dados_postgres:
